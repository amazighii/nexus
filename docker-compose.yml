services:
  # MongoDB - Users
  mongodb_users:
    image: mongo:7
    container_name: mongodb_users
    restart: unless-stopped
    networks:
      - shared-net
      # - users-net
    # expose:
    #   - "27017"
    ports:
      - "27017:27017"
    volumes:
      - mongodb_users_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # MongoDB - Products
  mongodb_products:
    image: mongo:7
    container_name: mongodb_products
    restart: unless-stopped
    networks:
      # - products-net
      - shared-net
    # expose:
    #   - "27017"
    ports:
      - "27018:27017"
    volumes:
      - mongodb_products_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # MongoDB - Media
  mongodb_media:
    image: mongo:7
    container_name: mongodb_media
    restart: unless-stopped
    networks:
      # - media-net
      - shared-net
    ports:
      - "27019:27017"
    volumes:
      - mongodb_media_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongodb_orders:
    image: mongo:7
    container_name: mongodb_orders
    restart: unless-stopped
    networks:
      # - orders-net
      - shared-net
    ports:
      - "27020:27017"
    volumes:
      - mongodb_orders_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    restart: unless-stopped
    networks:
      - shared-net
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      # 1. ADD PLAINTEXT_HOST to listeners so Kafka opens port 29092 inside the container
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092"

      # This part you already have correct!
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # 2. ADD PLAINTEXT_HOST:PLAINTEXT to the map so Kafka knows it's unencrypted text
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --list || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # MinIO
  minio:
    image: minio/minio
    container_name: minio-server
    restart: unless-stopped
    networks:
      # - media-net
      - shared-net
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # Traefik Edge Router
  # traefik:
  #   image: traefik:v3.6
  #   container_name: traefik
  #   restart: unless-stopped
  #   command:
  #     - "--providers.docker=true"
