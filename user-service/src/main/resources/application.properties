# Server
server.port=${SERVER_PORT:8081}

# Application
spring.application.name=${SPRING_APPLICATION_NAME:USER-SERVICE}

# MongoDB
# spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/userdb}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongodb_users:27017/userdb}
# spring.data.mongodb.database=userdb
# spring.data.mongodb.host=localhost
# spring.data.mongodb.port=27017
# spring.data.mongodb.database=userdb


# JWT
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-change-in-prod}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator
# management.endpoints.web.exposure.include=health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# Eureka Client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

# Debugging
logging.level.org.springframework.boot.context.config=DEBUG
