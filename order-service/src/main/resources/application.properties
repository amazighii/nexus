spring.application.name=ORDER-SERVICE
server.port=8084

# MongoDB
spring.data.mongodb.uri=${ORDER_MONGODB_URI:mongodb://localhost:27017/ordersdb}
# spring.data.mongodb.uri=${ORDER_MONGODB_URI:mongodb://mongodb_orders:27017/ordersdb}
spring.data.mongodb.database=${ORDER_MONGODB_DATABASE:ordersdb}


# Eureka Client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}